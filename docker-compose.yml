services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEON_DB: ${NEON_DB:-}
      YOUR_NEON_API_KEY: ${YOUR_NEON_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — point at the URL the
        # browser reaches the backend on, not the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
